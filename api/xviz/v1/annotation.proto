// WARNING: XVIZ Protobuf files are unstable, do not use
// --------------------------------------------------------

syntax = "proto3";

package xviz.v1;

option csharp_namespace = "xviz.V1";
option go_package = "wuwen.com/wwsi/api_gen/xviz/v1;v1";


import "xviz/v1/options.proto";
import "xviz/v1/style.proto";

message VisualBase {
  option (xviz_json_schema) = "core/annotation_base";
  string object_id = 1;
}

message Visual {
  option (xviz_json_schema) = "core/annotation_visual";
  VisualBase base = 1;
  repeated string style_classes = 2;
  StyleObjectValue inline_style = 3;
}